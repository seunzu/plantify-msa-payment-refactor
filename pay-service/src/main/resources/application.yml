spring:
  application:
    name: pay
  datasource:
    url: ${PAY_DATASOURCE_URL:jdbc:h2:mem:pay;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${PAY_DATASOURCE_USERNAME:sa}
    password: ${PAY_DATASOURCE_PASSWORD:}
    driver-class-name: ${PAY_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${PAY_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    show-sql: ${PAY_JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${PAY_JPA_DDL_AUTO:create-drop}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: true
    consumer:
      group-id: ${PAY_KAFKA_GROUP_ID:pay-service-group}
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.plantify.pay.ledger.dto.process"
        spring.json.value.default.type: com.plantify.pay.ledger.dto.process.PaymentApprovedEvent
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    topic:
      transaction-status: ${TRANSACTION_STATUS_TOPIC:transaction-status}
      payment-approved: ${PAYMENT_APPROVED_TOPIC:payment-approved}

redisson:
  redlock:
    servers:
      - ${REDISSON_REDIS_1:redis://localhost:6379}
      - ${REDISSON_REDIS_2:redis://localhost:6380}
      - ${REDISSON_REDIS_3:redis://localhost:6381}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
transaction:
  service:
    url: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
apiuser:
  service:
    url: ${APIUSER_SERVICE_URL:http://localhost:8085}

client:
  base:
    url: ${CLIENT_BASE_URL:http://localhost:3000}
  pay:
    url: ${CLIENT_PAY_URL:http://localhost:3000/payments}
  external:
    url: ${CLIENT_EXTERNAL_URL:http://localhost:3000}

server:
  port: ${PAY_SERVER_PORT:8082}
