services:
  redis-1:
    image: redis:7.4-alpine
    container_name: plantify-payment-redis-1
    ports:
      - "6379:6379"

  redis-2:
    image: redis:7.4-alpine
    container_name: plantify-payment-redis-2
    ports:
      - "6380:6379"

  redis-3:
    image: redis:7.4-alpine
    container_name: plantify-payment-redis-3
    ports:
      - "6381:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: plantify-payment-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: plantify-payment-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  pay-service:
    build:
      context: ./pay-service
    container_name: plantify-pay-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDISSON_REDIS_1: redis://redis-1:6379
      REDISSON_REDIS_2: redis://redis-2:6379
      REDISSON_REDIS_3: redis://redis-3:6379
      AUTH_SERVICE_URL: http://host.docker.internal:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
    ports:
      - "8082:8082"
    depends_on:
      redis-1:
        condition: service_started
      redis-2:
        condition: service_started
      redis-3:
        condition: service_started
      kafka:
        condition: service_started

  transaction-service:
    build:
      context: ./transaction-service
    container_name: plantify-transaction-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDISSON_REDIS_1: redis://redis-1:6379
      REDISSON_REDIS_2: redis://redis-2:6379
      REDISSON_REDIS_3: redis://redis-3:6379
      AUTH_SERVICE_URL: http://host.docker.internal:8081
      PAYMENT_SERVICE_URL: http://payment-service:8084
    ports:
      - "8083:8083"
    depends_on:
      redis-1:
        condition: service_started
      redis-2:
        condition: service_started
      redis-3:
        condition: service_started
      kafka:
        condition: service_started

  payment-service:
    build:
      context: ./payment-service
    container_name: plantify-payment-service
    environment:
      REDISSON_REDIS_1: redis://redis-1:6379
      REDISSON_REDIS_2: redis://redis-2:6379
      REDISSON_REDIS_3: redis://redis-3:6379
      AUTH_SERVICE_URL: http://host.docker.internal:8081
      PAY_SERVICE_URL: http://pay-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
    ports:
      - "8084:8084"
    depends_on:
      redis-1:
        condition: service_started
      redis-2:
        condition: service_started
      redis-3:
        condition: service_started
      kafka:
        condition: service_started
      pay-service:
        condition: service_started
      transaction-service:
        condition: service_started
