name: CI

on:
  push:
    branches: ["refactor", "refactor/**"]
  pull_request:
    branches: ["refactor"]

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - payment-service
          - pay-service
          - transaction-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: chmod +x gradlew && ./gradlew compileJava
        working-directory: ${{ matrix.service }}

  docker-build:
    runs-on: ubuntu-latest
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        service:
          - payment-service
          - pay-service
          - transaction-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: chmod +x gradlew && ./gradlew bootJar
        working-directory: ${{ matrix.service }}

      - name: Build Docker image
        run: docker build -t plantify/${{ matrix.service }}:ci .
        working-directory: ${{ matrix.service }}
