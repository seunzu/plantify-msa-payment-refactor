spring:
  application:
    name: payment
  datasource:
    url: ${PAYMENT_DATASOURCE_URL:jdbc:h2:mem:payment;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${PAYMENT_DATASOURCE_USERNAME:sa}
    password: ${PAYMENT_DATASOURCE_PASSWORD:}
    driver-class-name: ${PAYMENT_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${PAYMENT_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    show-sql: ${PAYMENT_JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${PAYMENT_JPA_DDL_AUTO:create-drop}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    topic:
      payment-approved: ${PAYMENT_APPROVED_TOPIC:payment-approved}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
pay:
  service:
    url: ${PAY_SERVICE_URL:http://localhost:8082}
transaction:
  service:
    url: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
payment:
  expiration:
    pending-minutes: ${PAYMENT_PENDING_EXPIRATION_MINUTES:5}
    schedule-delay-ms: ${PAYMENT_EXPIRATION_SCHEDULE_DELAY_MS:300000}

client:
  base:
    url: ${CLIENT_BASE_URL:http://localhost:3000}
  pay:
    url: ${CLIENT_PAY_URL:http://localhost:3000/payments}

jwt:
  secret: ${PAYMENT_JWT_SECRET:local-payment-secret-key}
  access-token-expiration: ${PAYMENT_JWT_ACCESS_TOKEN_EXPIRATION:3600000}

server:
  port: ${PAYMENT_SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
